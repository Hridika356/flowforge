spring.application.name=flowforge-backend
server.port=${PORT:8080}

# --- Database -------------------------------------------------------------
# Defaults match the local setup in README.md. Override with environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flowforge}
spring.datasource.username=${DB_USERNAME:flowforge}
spring.datasource.password=${DB_PASSWORD:flowforge}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Auth -----------------------------------------------------------------
# DEV-ONLY default. Set JWT_SECRET (32+ random characters) anywhere real.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# --- CORS -----------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
