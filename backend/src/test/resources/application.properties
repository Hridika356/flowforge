# Tests run against in-memory H2 in PostgreSQL mode, using the same Flyway migrations.
spring.datasource.url=jdbc:h2:mem:flowforge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-test-secret-test-secret-0123
app.jwt.expiration-minutes=60
app.cors.allowed-origins=http://localhost:5173
